  var DUREE = 60 * 60 * 1000, DB = 'accueil-protect', ST = 'k', ID = D.salt.slice(0, 12);
  function bytes(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function db(){ return new Promise(function(ok, ko){ var r = indexedDB.open(DB, 1); r.onupgradeneeded = function(){ r.result.createObjectStore(ST); }; r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ ko(r.error); }; }); }
  function kv(mode, fn){ return db().then(function(d){ return new Promise(function(ok, ko){ var tx = d.transaction(ST, mode), q = fn(tx.objectStore(ST)); tx.oncomplete = function(){ d.close(); ok(q && q.result); }; tx.onerror = function(){ d.close(); ko(tx.error); }; }); }); }
  function lire(){ return kv('readonly', function(s){ return s.get(ID); }).catch(function(){ return null; }); }
  function garder(key){ return kv('readwrite', function(s){ return s.put({ key: key, exp: Date.now() + DUREE }, ID); }).catch(function(){}); }
  function oublier(){ return kv('readwrite', function(s){ return s.delete(ID); }).catch(function(){}); }
  function derive(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(k){
      // clé NON exportable : elle peut être gardée 1 h dans ce navigateur sans jamais pouvoir en sortir
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:bytes(D.salt), iterations:D.it, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['decrypt']);
    });
  }
  function openWith(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(D.iv)}, key, bytes(D.ct)).then(function(pt){
      var html = new TextDecoder().decode(pt);
      var go = function(){ document.open(); document.write(html); document.close(); };
      // attendre la fin du chargement : sinon l'app s'insère dans la page du mot de passe au lieu de la remplacer
      if (document.readyState === 'complete') go(); else window.addEventListener('load', go, { once: true });
    });
  }
  function err(t){ document.getElementById('e').textContent = t; }
  if (!window.crypto || !crypto.subtle) { err('Navigateur trop ancien ou page non sécurisée (https requis).'); return; }
  document.getElementById('f').style.visibility = 'hidden';
  lire().then(function(x){
    if (x && x.key && x.exp > Date.now()) {
      return openWith(x.key).then(function(){ return garder(x.key); })   // 1 h de plus à chaque ouverture

    }
    if (x) oublier();

  document.getElementById('f').addEventListener('submit', function(ev){
    ev.preventDefault(); err('Vérification…');
    var remember = document.getElementById('r').checked;
    derive(document.getElementById('p').value).then(function(key){
